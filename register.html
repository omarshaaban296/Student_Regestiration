<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration | EduPortal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="login-page">
  
      <section class="login-panel">
        <form class="login-form" action="dashboard.html">
          <div class="eyebrow">NEW STUDENT</div>
          <h2>Create Account</h2>
          <p>Fill in your information to get started.</p>
          <div class="field">
            <label>Full Name</label
            ><input type="text" placeholder="Enter your full name" required />
          </div>
          <div class="field">
            <label>Student ID</label
            ><input type="text" placeholder="e.g. 20261025" required />
          </div>
          <div class="field">
            <label>University Email</label
            ><input type="email" placeholder="name@university.edu" required />
          </div>
          <div class="field">
            <label>Department</label
            ><select required>
              <option value="">Select department</option>
              <option>Computer Science</option>
              <option>Information Systems</option>
              <option>Information Technology</option>
            </select>
          </div>
          <div class="field">
            <label>Password</label
            ><input type="password" placeholder="Create a password" required />
          </div>
          <button class="btn" type="submit">Create Account →</button>
          <div class="login-bottom">
            Already registered? <a href="index.html">Sign in</a>
          </div>
          
        </form>
      </section>
    </div>
  </body>
</html>
